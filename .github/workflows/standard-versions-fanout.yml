# When a standard version moves, open a pull request in every repo that renders
# the STANDARD version table.
#
# WHY THE FAN-OUT LIVES HERE. The event is "a version in THIS repo changed", so
# the work belongs where the event is. It also has to live somewhere that may
# hold a credential, and the org .github repo may not: its AGENTS.md says no
# workflow there takes a secret. So .github holds the script and the no-secret
# drift check, and this repo holds the half that writes.
#
# WHY A GITHUB APP AND NOT THE BUILT-IN TOKEN. GITHUB_TOKEN cannot write to
# another repository at all, and a pull request opened with it does not trigger
# workflows, so the required "CI Gate" check would never run and the pull
# request could never merge. An App installation token does both. It is minted
# per run and expires within the hour; the only stored secret is the App private
# key.
#
# UNTIL THE APP EXISTS THIS WORKFLOW IS INERT BY DESIGN. With no secret set it
# reports what it would have done and succeeds, rather than failing a release.
# Automation that goes red on a missing credential trains people to ignore red.
#
# IT CARRIES TWO BLOCKS NOW. The STANDARD version table, which moves when a
# version in this repo moves, and the AiEDs disclosure block, which moves when
# the AiEDs README generator runs over the SessionEnd ledgers. Both are
# generated, both are delimited by markers, and both are synced by scripts that
# live in random-knights/.github. One fan-out carries both because the expensive
# part is the credential and the clone, not the rewrite, and two workflows
# opening two pull requests against the same README would conflict with each
# other for no gain.
#
# A README WITH NO AiEDs MARKERS IS SKIPPED, NOT FAILED. Adding the marker pair
# is a deliberate one-time edit in each repo, because a script that goes looking
# for a place to put a block ends up pattern-matching markdown, which is how
# every hand-maintained copy in this org drifted before. Until a repo opts in,
# this reports that it has not and moves on. A red run on a repo that has simply
# not adopted the block yet is a red run nobody can fix, and those teach people
# to ignore red.
#
# IT NEVER MERGES. It opens pull requests and stops.

name: Standard versions fan-out

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report what would change without opening pull requests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  fanout:
    name: Fan out the version table
    runs-on: ubuntu-latest
    steps:
      - name: Check out the standard
        uses: actions/checkout@v4

      - name: Check out the sync scripts and the generated AiEDs blocks
        uses: actions/checkout@v4
        with:
          repository: random-knights/.github
          path: .standard-sync
          sparse-checkout: |
            scripts
            aieds
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The versions file is gated by spec/test/standard-versions.test.mjs, so
      # by the time it is on main it already agrees with the documents. This
      # regenerates it anyway: a fan-out that publishes a stale number to five
      # repos is worse than one that does not run.
      - name: Re-derive the versions file and refuse if it drifted
        run: |
          set -euo pipefail
          node scripts/emit-standard-versions.mjs
          git diff --exit-code -- spec/v2/standard-versions.json

      - name: Is the App configured
        id: app
        env:
          APP_ID: ${{ secrets.RK_SYNC_APP_ID }}
        run: |
          if [ -n "${APP_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RK_SYNC_APP_ID is not set, so no pull requests will be opened. See docs/STANDARD-VERSION-SYNC.md."
          fi

      - name: Mint an installation token
        if: steps.app.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RK_SYNC_APP_ID }}
          private-key: ${{ secrets.RK_SYNC_APP_PRIVATE_KEY }}
          owner: random-knights
          repositories: |
            .github
            abc
            r1-01
            xyz-earth

      - name: Open a pull request in each consumer
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIGURED: ${{ steps.app.outputs.configured }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          VERSIONS="$PWD/spec/v2/standard-versions.json"
          SYNC="$PWD/.standard-sync/scripts/sync-standard-versions.mjs"
          AIEDS_SYNC="$PWD/.standard-sync/scripts/sync-aieds.mjs"
          AIEDS_SOURCE="$PWD/.standard-sync/aieds"
          BRANCH=chore/standard-versions

          # repo:readme:aieds-block triples. .github renders both blocks on the
          # org profile page, not on its own README, and its AiEDs block is the
          # ORGANISATION one. That block is filed under `organisation` and not
          # under `org`, because org IS a repository here and the collision put
          # one repo's figures on the public front page as the whole company's.
          TARGETS=".github:profile/README.md:organisation abc:README.md:abc r1-01:README.md:r1-01 xyz-earth:README.md:xyz-earth"

          for entry in $TARGETS; do
            repo="${entry%%:*}"
            rest="${entry#*:}"
            readme="${rest%%:*}"
            block="${rest#*:}"
            echo "::group::$repo"
            work="$(mktemp -d)"
            if [ "$CONFIGURED" != "true" ]; then
              echo "App not configured; would have checked $repo ($readme)."
              echo "::endgroup::"
              continue
            fi
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/random-knights/${repo}.git" "$work"
            if ! node "$SYNC" --write --source "$VERSIONS" "$work/$readme"; then
              echo "::error::$repo: $readme could not be rewritten (missing STANDARD markers?)"
              echo "::endgroup::"
              continue
            fi
            # Exit 2 from the AiEDs sync means a real problem, and the only one
            # a consumer can have here is "no AIEDS markers yet", which is an
            # opt-in state and not a failure. Anything else would already have
            # failed the STANDARD sync above, on the same file.
            set +e
            node "$AIEDS_SYNC" --write --repo "$block" --source "$AIEDS_SOURCE" "$work/$readme"
            aieds_code=$?
            set -e
            if [ "$aieds_code" -eq 2 ]; then
              echo "::notice::$repo: $readme carries no AIEDS markers yet, so the AiEDs block was not placed. Add the marker pair once, by hand, to opt in."
            fi
            cd "$work"
            if git diff --quiet -- "$readme"; then
              echo "$repo: already in sync"
              cd - >/dev/null
              echo "::endgroup::"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "$repo: WOULD open a pull request:"
              git --no-pager diff -- "$readme"
              cd - >/dev/null
              echo "::endgroup::"
              continue
            fi
            git config user.name "standard-sync[bot]"
            git config user.email "329637049+standard-sync[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add -- "$readme"
            git commit -F - <<'MSG'
          chore(readme): sync the generated README blocks

          Regenerates the STANDARD version table from the versions published by
          random-knights/standard, which derives them from the canonical
          documents and gates them, and the AiEDs disclosure block from the
          blocks published in random-knights/.github, which the AiEDs README
          generator produced from the SessionEnd ledgers.

          This commit carries no judgement of its own. Nobody hand-edited either
          block, and a guard fails a README where somebody has.

          Opened by standard-sync[bot].
          MSG
            git push --force-with-lease origin "$BRANCH"
            if ! gh pr view "$BRANCH" --repo "random-knights/$repo" --json number >/dev/null 2>&1; then
              gh pr create --repo "random-knights/$repo" \
                --head "$BRANCH" \
                --title "chore(readme): sync the generated README blocks" \
                --body "This regenerates the generated blocks in $readme: the STANDARD version table from the versions published at https://standard.rand0m.ai/versions.json, and the AiEDs disclosure block from the blocks published in random-knights/.github. Both are generated, neither was hand-edited, and a guard fails a README where one has drifted. The bot does not merge; review and merge when you are happy."
            fi
            cd - >/dev/null
            echo "::endgroup::"
          done
