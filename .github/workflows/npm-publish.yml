# Publish @randomknights/aieds, @randomknights/k13 or @randomknights/earthplus
# to npm with npm trusted publishing (OIDC) and provenance. Manual dispatch
# only, from main only.
#
# DISABLED until the owner links each package to this workflow on npmjs.com.
# The job runs only when the repository variable NPM_TRUSTED_PUBLISHING is
# "enabled"; until then every dispatch is skipped and publishes nothing. There
# is no NPM_TOKEN: trusted publishing exchanges this job's OIDC token for a
# short-lived publish credential, and only for a package whose npmjs.com
# settings name this repository, this workflow file and this environment.
#
# Owner steps, once per package, after the first manual publish (a trusted
# publisher can only be added to a package that already exists):
#   npmjs.com -> the package -> Settings -> Trusted publishing -> GitHub Actions
#     Organization or user:  random-knights
#     Repository:            standard
#     Workflow filename:     npm-publish.yml
#     Environment name:      npm-publish
# Then set the repository variable (Settings -> Secrets and variables ->
# Actions -> Variables): NPM_TRUSTED_PUBLISHING = enabled.
#
# A version is published once. Bump the version in packages/<name>/package.json
# on main first; npm refuses to publish over an existing version, and a STAGED
# version occupies that version number too.
#
# THIS JOB STAGES; IT DOES NOT PUBLISH. The owner promotes with
# `npm stage approve <stage-id>`, which requires 2FA. See the publish step.
name: npm publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - aieds
          - k13
          - earthplus

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @randomknights/${{ inputs.package }}
    if: vars.NPM_TRUSTED_PUBLISHING == 'enabled' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: npm with trusted publishing support
        run: npm install -g npm@^11.5.1 && npm --version

      - name: K13 checker tests
        run: cd packages/k13 && npm test

      # The same tarball gate CI runs on every change: exact file list, no
      # tests, fixtures, secrets or .env files, installed and smoke tested.
      - name: Check the tarballs
        run: node scripts/check-npm-packages.mjs

      # STAGE, not publish. The trusted publisher on npmjs.com is configured
      # WITHOUT "allow direct publish", which is npm's own recommendation and
      # matches the rule that a release is an owner act. Unchecked does not
      # silently reroute a direct publish to staging: it refuses it. Run
      # 36085426416 on 2026-09-25 failed with
      #   403 Forbidden - PUT .../@randomknights%2faieds
      #   OIDC permission denied for this action
      # because this step ran `npm publish`. `npm stage publish` has parity
      # with `npm publish` and takes the same flags.
      #
      # The staged version is then promoted by the owner with
      #   npm stage approve <stage-id>
      # which requires 2FA and therefore CANNOT be done by this job. That is
      # the gate, not an inconvenience: CI builds and proves the tarball, a
      # human decides it ships.
      - name: Stage for publication, with provenance
        run: cd "packages/${{ inputs.package }}" && npm stage publish --provenance --access public

      - name: How to promote what this run staged
        run: |
          echo "Staged @randomknights/${{ inputs.package }}."
          echo ""
          echo "Nothing is on the registry yet. To promote it, as the owner:"
          echo "  npm stage list @randomknights/${{ inputs.package }}"
          echo "  npm stage approve <stage-id>        # prompts for 2FA"
          echo ""
          echo "To discard it instead:"
          echo "  npm stage reject <stage-id>"
          echo ""
          echo "Then confirm every release surface agrees:"
          echo "  npm run check:published"
