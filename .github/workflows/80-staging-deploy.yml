name: 80-staging-deploy

# Merging to main IS deploying to staging. This builds the exact
# .firebase/standard-site tree the same way spec/test/site-output.test.mjs
# proves it, records a sha256 manifest of it, deploys that tree to the
# staging site in randomknights-abc, and then PROVES the site is serving
# those exact bytes.
#
# Staging deploys into randomknights-abc. Production deploys into
# randomknights-xyz and stays an owner action by hand, per CONTRIBUTING.md:
# there is no production release workflow here on purpose.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standard-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGING_URL: https://abc-standard-rand0m-ai.web.app
  STAGING_CUSTOM_URL: https://stg.standard.rand0m.ai
  STAGING_BUCKET: randomknights-abc-staging-private
  SITE_PREFIX: standard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install spec deps
        run: cd spec && npm install
      - name: Build the site
        run: node scripts/build-site.mjs
      - name: Gate the built tree (byte-identical to repo sources, nothing missing, no CR bytes)
        run: cd spec && npm test
      - name: Create byte manifest
        run: |
          cd .firebase/standard-site
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ../../public.sha256
          # Check from inside the built tree: the manifest paths are relative to it.
          # Checked from the repo root, the first run read ./index.html at the root
          # and failed on six files while three that also exist there passed.
          sha256sum -c ../../public.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: standard-site
          path: |
            .firebase/standard-site/
            public.sha256
          retention-days: 30
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/download-artifact@v6
        with:
          name: standard-site
      - name: Verify downloaded artifact
        run: |
          cd .firebase/standard-site
          sha256sum -c ../../public.sha256
      - name: Upload the exact artifact to the private staging bucket
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RANDOMKNIGHTS_ABC }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_RANDOMKNIGHTS_ABC is not available to this repository."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" \
            --project randomknights-abc >/dev/null
          gcloud storage rsync --recursive --delete-unmatched-destination-objects \
            ".firebase/standard-site" "gs://$STAGING_BUCKET/$SITE_PREFIX"
      - name: Deploy the gate shim to staging hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RANDOMKNIGHTS_ABC }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@14 deploy --only hosting:staging --project randomknights-abc --non-interactive
      - name: Prove the staging bytes in the bucket
        run: |
          set -euo pipefail
          manifest="$PWD/public.sha256"
          rm -rf "$RUNNER_TEMP/proof"
          mkdir -p "$RUNNER_TEMP/proof"
          gcloud storage cp --recursive "gs://$STAGING_BUCKET/$SITE_PREFIX/*" "$RUNNER_TEMP/proof/" >/dev/null
          cd "$RUNNER_TEMP/proof"
          sha256sum -c "$manifest"
          echo "staging byte proof passed for $(wc -l < "$manifest") files in gs://$STAGING_BUCKET/$SITE_PREFIX"
      - name: Prove the gate is closed to an unauthenticated visitor
        run: |
          set -euo pipefail
          # The site itself must never reach a stranger. Both the default host
          # and the custom staging hostname have to answer with the gate's
          # sign-in page, and the bytes must not be the site's own index.
          index_sha=$(awk '$2 == "./index.html" { print $1 }' "public.sha256")
          if [ -z "$index_sha" ]; then
            echo "FAIL: the manifest has no ./index.html to compare against"
            exit 1
          fi
          for host in "$STAGING_URL" "$STAGING_CUSTOM_URL"; do
            passed=""
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o "$RUNNER_TEMP/gate.html" -w '%{http_code}' "$host/") || code=000
              if [ "$code" = "200" ] && grep -q 'rk-staging-gate-sign-in' "$RUNNER_TEMP/gate.html"; then
                passed="yes"
                break
              fi
              echo "retrying $host (attempt $attempt/6): status=$code"
              sleep 10
            done
            if [ -z "$passed" ]; then
              echo "FAIL: $host did not return the gate sign-in page"
              exit 1
            fi
            served_sha=$(sha256sum "$RUNNER_TEMP/gate.html" | awk '{ print $1 }')
            if [ "$served_sha" = "$index_sha" ]; then
              echo "FAIL: $host served the site itself to an unauthenticated request"
              exit 1
            fi
            echo "gate closed on $host"
          done
