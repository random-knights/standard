name: CI

on:
  push:
    # This repo's default branch is master, not main. This filter said [main]
    # from the start, so push-CI NEVER fired on any commit that landed here -
    # only pull_request runs did. That gap is how lib/ drifted a major version
    # without a single failing signal. Keep this in sync with the default
    # branch; if the default is ever renamed, change it here too.
    branches: [master]
  pull_request:

jobs:
  spec:
    name: Validate spec examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install spec deps
        run: cd spec && npm install

      - name: Validate examples against aieds.schema.json
        run: cd spec && node examples/validate.mjs

  mcp:
    name: Build + test MCP server
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP deps
        run: cd mcp && npm install

      - name: Build (TypeScript)
        run: cd mcp && npm run build

      - name: Unit tests
        run: cd mcp && npm test

  lib:
    name: Build + test reference library
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lib deps
        run: cd lib && npm install

      - name: Build (TypeScript)
        run: cd lib && npm run build

      - name: Unit tests
        run: cd lib && npm test

  # Aggregating gate: one check that is green only when all three jobs above
  # pass. Named "CI Gate" so the org ci-gate-required ruleset can pin a single
  # context for this repo. Does no work of its own; it only depends on the jobs.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [spec, mcp, lib]
    steps:
      - name: All required jobs passed
        run: echo "spec, mcp, and lib all passed."
