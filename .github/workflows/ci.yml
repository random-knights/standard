name: CI

on:
  push:
    # Keep this in sync with the default branch. It said [main] while the
    # default was master, so push-CI never fired on any commit that landed
    # here and only pull_request runs did; that gap is how lib/ drifted a
    # major version without a single failing signal. The default branch was
    # renamed master to main on 2026-08-26, so this filter now names main
    # again, and this time it matches.
    branches: [main]
  pull_request:
  # Manual escape hatch. On 2026-08-26 pull_request events stopped creating
  # runs for this repo's own workflows while GitHub-managed CodeQL kept
  # firing, which left PRs with no CI signal at all and a required check that
  # could never arrive. A dispatch on the same ref runs the identical jobs, so
  # the suite can still be verified against a real runner while that is
  # investigated. This does not bypass anything: it is the same gate.
  workflow_dispatch:

jobs:
  spec:
    name: Validate spec examples
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install spec deps
        run: cd spec && npm install

      - name: Validate examples and gate the factor tables
        run: cd spec && npm test

  mcp:
    name: Build + test MCP server
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MCP deps
        run: cd mcp && npm install

      - name: Build (TypeScript)
        run: cd mcp && npm run build

      - name: Unit tests
        run: cd mcp && npm test

  lib:
    name: Build + test reference library
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lib deps
        run: cd lib && npm install

      - name: Build (TypeScript)
        run: cd lib && npm run build

      - name: Unit tests
        run: cd lib && npm test

  # Aggregating gate: one check that is green only when all three jobs above
  # pass. Named "CI Gate" so the org ci-gate-required ruleset can pin a single
  # context for this repo. Does no work of its own; it only depends on the jobs.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [spec, mcp, lib]
    steps:
      - name: All required jobs passed
        run: echo "spec, mcp, and lib all passed."
